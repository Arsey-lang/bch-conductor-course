<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https: data:; base-uri 'none'; form-action 'none'">

<title>Конспект: курсы проводника</title>
<style>
:root{
  --paper:#F0F4F8; --panel:#FFFFFF; --ink:#102A43; --steel:#486581; --line:#D9E2EC;
  --accent:#1D4ED8; --amber:#D97706; --danger:#DC2626;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0B132B;--panel:#1C2541;--ink:#F0F4F8;--steel:#9FB3C8;--line:#334E68;--accent:#60A5FA;--amber:#FBBF24;--danger:#F87171}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 var(--sans)}
body.editing{padding-bottom:96px}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:0;z-index:11;display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font:700 21px var(--serif);flex:1;min-width:0}
.menubtn{display:none;font-size:20px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;cursor:pointer}
.prog{font-size:13px;color:var(--steel);text-align:right;min-width:120px}
.pbar{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

.layout{display:grid;grid-template-columns:310px 1fr;gap:40px;max-width:1120px;margin:0 auto;padding:28px 20px 40px}
.side{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.search{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);margin-bottom:14px}
.search:focus{border-color:var(--accent);outline:none}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.toc a:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.toc a.on{background:var(--accent);color:var(--paper)}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px;font-weight:700}
.toc .none{color:var(--steel);padding:10px 12px}

.content{min-width:0}
.kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.lt{font:700 clamp(30px,5vw,44px)/1.12 var(--serif);margin:0 0 26px;letter-spacing:-.3px}
.item{position:relative;margin:0 0 20px;max-width:68ch}
.multi{white-space:pre-wrap}
.txt{margin:0;font-size:18px;line-height:1.72}
.bul{margin:0;padding-left:0;list-style:none}
.bul li{position:relative;padding:4px 40px 4px 26px;font-size:18px}
.bul li::before{content:"";position:absolute;left:4px;top:15px;width:9px;height:9px;border-radius:2px;background:var(--accent)}
.note{padding:16px 18px;border-radius:14px;border-left:6px solid var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--panel))}
.note.remember{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--panel))}
.note .lab{display:block;font:700 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:4px;background:none;border:0;padding:0;text-align:left}
.note.remember .lab{color:var(--accent)}
.fig{margin:0}
.fig img{display:block;max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.cap{color:var(--steel);font-size:15px;margin-top:8px}
.noimg{border:2px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--steel)}
.foot{margin-top:36px;padding-top:24px;border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.done{font:600 16px var(--sans);padding:13px 22px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.done.on{background:var(--accent);color:var(--paper)}
.nav2{display:flex;justify-content:space-between;gap:12px;margin-top:20px;max-width:68ch}
.nav2 a{padding:12px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;font-weight:600}
footer{max-width:1120px;margin:0 auto;padding:24px 20px 56px;color:var(--steel);font-size:14px;border-top:1px solid var(--line)}
.linkbtn{background:none;border:0;color:var(--steel);font:inherit;text-decoration:underline;cursor:pointer;padding:0;margin-left:12px;opacity:.75}

/* поиск, разделы */
.srchbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.sp{position:fixed;z-index:20;top:69px;left:0;right:0;max-height:calc(100vh - 69px);overflow:auto;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 20px 40px -24px rgba(0,0,0,.45)}
.spin{max-width:760px;margin:0 auto;padding:16px 20px 20px}
.sin{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--accent);border-radius:14px;background:var(--panel);color:var(--ink)}
.sin:focus{outline:none}
.res{list-style:none;margin:12px 0 0;padding:0}
.res .cnt{color:var(--steel);font-size:14px;padding:4px 2px 8px}
.hit{display:block;width:100%;text-align:left;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.hit:hover{border-color:var(--accent)}
.hw{display:block;font-weight:700;font-size:14px;color:var(--accent);margin-bottom:2px}
.hs2{display:block;font-size:16px;line-height:1.5}
mark{background:color-mix(in srgb,var(--amber) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sh{margin:0;font:700 26px/1.2 var(--serif);padding:10px 0 10px 16px;border-left:6px solid var(--accent);
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent 75%)}
.item.hd{margin:38px 0 14px;scroll-margin-top:84px;max-width:none}
.mtoc{margin:0 0 26px;padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);max-width:68ch}
.mt{font:700 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:6px}
.mtoc ul{list-style:none;margin:0;padding:0}
.ml{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;font-weight:600;color:var(--accent);padding:7px 0;cursor:pointer}
.ml:hover{text-decoration:underline}
.nav2{margin-top:40px}

/* главная */
.home{max-width:980px;margin:0 auto;padding:clamp(40px,10vh,100px) 20px 40px;text-align:center;min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center}
.hl{font:700 clamp(34px,6vw,60px)/1.08 var(--serif);margin:0 0 14px;letter-spacing:-.4px}
.hs{color:var(--steel);font-size:19px;margin:0 auto 40px;max-width:46ch}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;text-align:left}
.card{display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:20px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 34px -20px rgba(15,107,79,.55)}
.num{font:700 15px var(--sans);color:var(--paper);background:var(--accent);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.ct{font:700 21px/1.25 var(--serif)}
.cd{margin-top:auto;color:var(--accent);font-weight:600;font-size:15px}
.hprog{margin:30px auto 0;width:min(320px,100%);font-size:13px;color:var(--steel)}
.homebtn{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}
.brand:not(.ed){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.cards{grid-template-columns:1fr}.card{padding:20px}}

/* редактор */
.ed{outline:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:3px;min-height:1.2em;border-radius:2px}
.ed:focus{outline:2px solid var(--accent)}
.ed:empty::before{content:attr(data-ph);color:var(--steel);opacity:.6}
.lbar,.ibar{display:flex;gap:6px;align-items:center}
.lbar{margin-bottom:14px;color:var(--steel);font-size:14px;flex-wrap:wrap}
.ibar{margin-top:6px}
.lbar button,.ibar button,.mini,.x{font:600 13px var(--sans);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;min-width:36px;height:36px;padding:0 10px;cursor:pointer}
.mini{color:var(--accent);margin-top:8px}
.x{position:absolute;right:0;top:4px;color:var(--danger);min-width:34px;height:34px}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:30}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px;background:var(--ink);padding-bottom:max(12px,env(safe-area-inset-bottom))}
.tools button{background:var(--paper);color:var(--ink);border:0;border-radius:10px;height:42px;padding:0 15px;font:600 15px var(--sans);cursor:pointer}
.tools .pri{background:var(--accent);color:var(--paper)}
.menu{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px;background:var(--panel);border-top:1px solid var(--line)}
.menu button{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 16px;font:600 15px var(--sans);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(8,16,12,.6);display:grid;place-items:center;z-index:60;padding:20px}
.dlg{background:var(--panel);border-radius:18px;padding:28px;width:min(360px,100%);display:grid;gap:14px}
.dlg h3{margin:0;font:700 22px var(--serif)}
.dlg input{font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
.dlg .row{display:flex;gap:10px}
.dlg button{flex:1;height:44px;border-radius:10px;border:0;font:600 16px var(--sans);cursor:pointer;background:var(--paper);color:var(--ink)}
.dlg button.go{background:var(--accent);color:var(--paper)}
.err{color:var(--danger);min-height:22px;font-size:14px}

@media (max-width:860px){
  .menubtn{display:block}
  .layout{display:block;padding-top:20px}
  .side{position:fixed;z-index:12;top:69px;left:0;bottom:0;width:min(88vw,340px);max-height:none;background:var(--paper);
    padding:16px;border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .25s}
  body.menu .side{transform:none}
  body.menu::after{content:"";position:fixed;inset:69px 0 0 0;background:rgba(8,16,12,.45);z-index:9}
  .prog{display:none}
}
@media print{
  .top,.side,.ibar,.lbar,.foot,.nav2,footer,#ui{display:none!important}
  .layout{display:block;padding:0}body{background:#fff;color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

          "text": "При отцепке вагона начальник поезда составляет акт в 3 экземплярах, выделяет проводников для охраны имущества, информирует пассажиров и размещает их на свободные или служебные места в других вагонах состава. В проездных документах делаются отметки о вынужденной отцепке или замене вагона."
        },
        {
          "t": "h",
          "text": "8. Опоздание или отклонение от основного маршрута"
        },
        {
          "t": "text",
          "text": "При изменении маршрута начальник поезда информирует пассажиров станций, которые поезд не будет проследовать, о порядке пересадки и делает отметки в билетах (для электронных билетов выдается акт по общему случаю). При длительной задержке поезда сведения о транзитных пассажирах передаются поездному диспетчеру ЦУП."
        },
        {
          "t": "h",
          "text": "9. Действия в случаях возникновения чрезвычайных ситуаций"
        },
        {
          "t": "list",
          "items": [
            "При крушениях, авариях, сходах с рельсов или столкновениях работники оценивают уровень опасности, закрепляют и ограждают подвижной состав, ликвидируют опасные факторы (пожар, ток) и оказывают первую помощь пострадавшим.",
            "При стрельбе внутри вагона проводник сообщает по цепочке начальнику поезда, принимает меры по изоляции стрелявшего (с привлечением сотрудников МВД или военнослужащих из числа пассажиров) и эвакуирует пассажиров в другие вагоны.",
            "При стрельбе снаружи вагона необходимо разместить пассажиров вдоль боковых стен ниже окон, желательно в лежачем положении."
          ]
        },
        {
          "t": "h",
          "text": "10. Действия по прибытии поезда на станцию, во время стоянки и при отправлении"
        },
        {
          "t": "list",
          "items": [
            "После остановки поезда проводник открывает дверь, фиксирует ее, протирает поручни, поднимает откидную площадку и проводит посадку/высадку, стоя у двери со стороны автосцепки.",
            "При отправлении проводники штабного и хвостового вагонов провожают станцию до конца платформы, показывая днем свернутый желтый флаг, ночью — прозрачно-белый огонь фонаря.",
            "Если посадка/высадка не завершена в отведенное время, проводник подает сигнал остановки (красный флаг / красный огонь), который дублируется по составу.",
            "При попытке самовольной посадки пассажира на ходу поезда работник немедленно останавливает поезд стоп-краном."
          ]
        },
        {
          "t": "h",
          "text": "11. Конфликтные ситуации, их предотвращение и разрешение"
        },
        {
          "t": "list",
          "items": [
            "Все споры и конфликты разрешаются в мирной, спокойной и доброжелательной обстановке.",
            "При выявлении пассажиров с билетами на одно место («двойников») проводник обязан посадить их в вагон и вызвать начальника поезда для рассадки и составления акта.",
            "Безбилетным пассажирам предлагается оплатить проезд, сбор и штраф; при отказе составляется протокол и пассажир высаживается на ближайшей станции (при необходимости с участием сотрудников МВД).",
            "Забытые вещи или вещи отставшего пассажира описываются в акте в присутствии двух свидетелей-пассажиров и сдаются по акту на станцию."
          ]
        },
        {
          "t": "h",
          "text": "12. Выявление пассажира, нарушающего общественный порядок"
        },
        {
          "t": "text",
          "text": "При выявлении при посадке или в пути следования пассажира, нарушающего общественный порядок или находящегося в состоянии сильного алкогольного/наркотического опьянения, проводник делает вежливое замечание. При неподчинении начальник поезда через машиниста вызывает сотрудников органов внутренних дел на ближайшую станцию для отказа в поездке или высадки с составлением акта в 3 экземплярах. Запрещены грубость, угрозы, сарказм и обращение на «ты»."
        },
        {
          "t": "h",
          "text": "13. Передача информации о совершенных правонарушениях"
        },
        {
          "t": "text",
          "text": "При обращении пассажира о совершении в отношении него преступления или правонарушения начальник поезда составляет информационную карточку в 2 экземплярах и по радиосвязи передает машинисту данные (участок, № поезда, № вагона, вид и время правонарушения) для вызова полиции на ближайшую по графику станцию."
        },
        {
          "t": "h",
          "text": "14. Причинение вреда жизни и здоровью пассажира"
        },
        {
          "t": "text",
          "text": "Работники поездной бригады оказывают первую помощь и сообщают начальнику поезда, который через машиниста вызывает медперсонал. Составляется акт о травме в 3 экземплярах (один выдается пострадавшему)."
        },
        {
          "t": "h",
          "text": "15. Оказание первой помощи пассажирам"
        },
        {
          "t": "text",
          "text": "При жалобе на плохое самочувствие проводник сообщает начальнику поезда, который через машиниста вызывает медиков на ближайшую станцию, а также организует поиск врачей среди пассажиров (днем — по громкой связи, ночью — опросом). При подозрении на инфекционные заболевания соблюдаются санитарно-противоэпидемические меры."
        },
        {
          "t": "h",
          "text": "16. Станции с длиной платформ менее длины поезда"
        },
        {
          "t": "text",
          "text": "При подъезде к станции с короткой платформой начальник поезда (днем по громкой связи) и проводники (лично при возврате билетов) заблаговременно предупреждают пассажиров о необходимости пройти для высадки в вагоны, находящиеся в пределах платформы."
        },
        {
          "t": "h",
          "text": "17. Требования к петардам"
        },
        {
          "t": "text",
          "text": "Последний (хвостовой) вагон экипируется сумкой проводника хвостового вагона с двумя комплектами сигнальных флагов и коробкой петард (6 шт.). Гарантийный срок службы петард — 4 года (после комиссионной проверки продлевается до 4 лет), максимальный срок службы — не более 10 лет. Каждый случай применения петард оформляется актом."
        }
      ]
    }
  ]
}
</script>

<script>
(() => {
  const KEY = 'konspekt-site-v1';
  const $ = id => document.getElementById(id);
  const base = JSON.parse($('site-data').textContent);
  let data = base, editing = false, fails = 0, cur = null;

  try {
    const s = localStorage.getItem(KEY);
    if (s) { const d = JSON.parse(s); if (d && Array.isArray(d.lessons)) { data = d; data.auth = d.auth || base.auth; } }
  } catch {}
  try { editing = sessionStorage.getItem('konspekt-edit') === '1'; } catch {}

  const safeImg = u => /^(https:\/\/|data:image\/(jpeg|png|webp|gif);base64,|[\w\-./]+$)/i.test(u || '');
  const uid = () => 'l' + Math.random().toString(36).slice(2, 8);

  function h(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c);
    return e;
  }

  let timer;
  function save() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(data)); }
      catch { alert('Не удалось сохранить в браузере: не хватает места. Скачайте файл.'); }
    }, 250);
  }

  function F(tag, cls, obj, key, ph, multi) {
    const e = h(tag, { class: cls + (multi ? ' multi' : '') });
    e.textContent = obj[key] || '';
    if (!editing) return e;
    try { e.contentEditable = 'plaintext-only'; } catch { e.contentEditable = 'true'; }
    if (e.contentEditable !== 'plaintext-only') e.contentEditable = 'true';
    e.classList.add('ed');
    e.dataset.ph = ph || '';
    e.addEventListener('input', () => { obj[key] = e.textContent; save(); });
    e.addEventListener('paste', ev => {
      ev.preventDefault();
      document.execCommand('insertText', false, (ev.clipboardData || window.clipboardData).getData('text/plain'));
    });
    if (!multi) e.addEventListener('keydown', ev => { if (ev.key === 'Enter') ev.preventDefault(); });
    return e;
  }

  function pickImage(cb) {
    const i = h('input', { type: 'file', accept: 'image/*' });
    i.addEventListener('change', () => {
      const f = i.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const s = Math.min(1, 1200 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => alert('Не удалось открыть картинку.');
        img.src = r.result;
      };
      r.readAsDataURL(f);
    });
    i.click();
  }

  const swap = (arr, i, d) => {
    const j = i + d; if (j < 0 || j >= arr.length) return false;
    [arr[i], arr[j]] = [arr[j], arr[i]]; return true;
  };

  /* ---------- содержимое урока ---------- */
  const ITEM_TYPES = {
    h: { label: 'Заголовок', make: () => ({ t: 'h', text: 'Название раздела' }) },
    text: { label: 'Текст', make: () => ({ t: 'text', text: 'Новый абзац.' }) },
    list: { label: 'Список', make: () => ({ t: 'list', items: ['Пункт'] }) },
    note: { label: 'Важно', make: () => ({ t: 'note', kind: 'important', text: 'Важная мысль.' }) },
    image: { label: 'Картинка', make: () => ({ t: 'image', url: '', caption: '' }) }
  };

  function itemEl(l, it, k) {
    let body;
    switch (it.t) {
      case 'h': body = F('h3', 'sh', it, 'text', 'Название раздела'); break;
      case 'text': body = F('p', 'txt', it, 'text', 'Текст', true); break;
      case 'list': {
        it.items = Array.isArray(it.items) ? it.items : [];
        const ul = h('ul', { class: 'bul' });
        it.items.forEach((_, j) => {
          const li = h('li', {}, F('span', '', it.items, j, 'Пункт', true));
          if (editing) li.append(h('button', { class: 'x', type: 'button', 'aria-label': 'Удалить пункт', onclick: () => { it.items.splice(j, 1); save(); render(); } }, '✕'));
          ul.append(li);
        });
        body = h('div', {}, ul, editing ? h('button', { class: 'mini', type: 'button', onclick: () => { it.items.push('Новый пункт'); save(); render(); } }, '+ Пункт') : null);
        break;
      }
      case 'note': {
        const label = it.kind === 'remember' ? 'Запомнить' : 'Важно';
        const lab = editing
          ? h('button', { class: 'lab', type: 'button', onclick: () => { it.kind = it.kind === 'remember' ? 'important' : 'remember'; save(); render(); } }, label + ' (сменить)')
          : h('span', { class: 'lab' }, label);
        body = h('div', { class: 'note ' + (it.kind === 'remember' ? 'remember' : 'important') }, lab, F('div', 'txt', it, 'text', 'Текст', true));
        break;
      }
      case 'image': {
        const fig = h('figure', { class: 'fig' });
        if (it.url && safeImg(it.url)) fig.append(h('img', { src: it.url, alt: it.caption || '', loading: 'lazy' }));
        else if (editing) fig.append(h('div', { class: 'noimg' }, 'Картинки пока нет'));
        if (editing) fig.append(h('div', { class: 'ibar' },
          h('button', { type: 'button', onclick: () => pickImage(u => { it.url = u; save(); render(); }) }, 'Загрузить'),
          h('button', { type: 'button', onclick: () => {
            const v = prompt('Адрес картинки (https://… или имя файла из репозитория):', it.url && !it.url.startsWith('data:') ? it.url : '');
            if (v !== null && (v === '' || safeImg(v.trim()))) { it.url = v.trim(); save(); render(); }
            else if (v !== null) alert('Адрес не подходит.');
          } }, 'По ссылке')));
        if (editing || it.caption) fig.append(F('figcaption', 'cap', it, 'caption', 'Подпись'));
        body = fig; break;
      }
      default: return null;
    }
    const w = h('div', { class: 'item' + (it.t === 'h' ? ' hd' : '') }, body);
    if (it.t === 'h') w.id = 'sec-' + k;
    if (editing) w.append(h('div', { class: 'ibar' },
      h('button', { type: 'button', 'aria-label': 'Вверх', onclick: () => { if (swap(l.items, k, -1)) { save(); render(); } } }, '↑'),
      h('button', { type: 'button', 'aria-label': 'Вниз', onclick: () => { if (swap(l.items, k, 1)) { save(); render(); } } }, '↓'),
      h('button', { type: 'button', 'aria-label': 'Удалить блок', onclick: () => { if (confirm('Удалить блок?')) { l.items.splice(k, 1); save(); render(); } } }, '✕')));
    return w;
  }

  function lessonEl(l, i) {
    const n = data.lessons.length;
    l.items = Array.isArray(l.items) ? l.items : [];
    const art = h('article', { class: 'lesson' });
    if (editing) art.append(h('div', { class: 'lbar' }, 'Тема:',
      h('button', { type: 'button', 'aria-label': 'Выше в списке', onclick: () => { if (swap(data.lessons, i, -1)) { save(); render(); } } }, '↑'),
      h('button', { type: 'button', 'aria-label': 'Ниже в списке', onclick: () => { if (swap(data.lessons, i, 1)) { save(); render(); } } }, '↓'),
      h('button', { type: 'button', onclick: () => {
        if (!confirm('Удалить всю тему?')) return;
        data.lessons.splice(i, 1); save(); pickCur(); render();
      } }, '✕ Удалить тему')));
    art.append(h('div', { class: 'kick' }, 'Тема ' + (i + 1) + ' из ' + n), F('h2', 'lt', l, 'title', 'Название темы'));
    const heads = l.items.map((it, k) => [it, k]).filter(([it]) => it.t === 'h' && it.text);
    if (heads.length >= 2) art.append(h('nav', { class: 'mtoc', 'aria-label': 'Разделы темы' },
      h('div', { class: 'mt' }, 'В этой теме'),
      h('ul', {}, heads.map(([it, k]) => h('li', {}, h('button', { class: 'ml', type: 'button', onclick: () => {
        const el = document.getElementById('sec-' + k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } }, it.text))))));
    l.items.forEach((it, k) => { const e = itemEl(l, it, k); if (e) art.append(e); });


    const prev = data.lessons[i - 1], next = data.lessons[i + 1];
    art.append(h('div', { class: 'nav2' },
      prev ? h('a', { href: '#l-' + prev.id }, '← Назад') : h('span'),
      next ? h('a', { href: '#l-' + next.id }, 'Дальше →') : h('span')));
    return art;
  }

  /* ---------- страница ---------- */
  function pickCur() {
    const m = location.hash.match(/^#l-(.+)$/);
    const l = data.lessons.find(x => x.id === (m && m[1]));
    cur = l ? l.id : null;
  }

  function renderToc() {
    const ul = $('toc'); if (!ul) return;
    ul.replaceChildren(...data.lessons.map((l, i) => h('li', {},
      h('a', { href: '#l-' + l.id, class: l.id === cur ? 'on' : '' },
        h('span', { class: 'ck' }, String(i + 1)), h('span', {}, l.title || 'Без названия')))));
  }

  /* ---------- поиск ---------- */
  const ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  let hl = '', keepHl = false;

  function searchBtn() {
    const b = h('button', { class: 'srchbtn', type: 'button', 'aria-label': 'Поиск по тексту', onclick: toggleSearch });
    b.innerHTML = ICON;
    return b;
  }

  function toggleSearch() {
    const sp = $('sp'); if (!sp) return;
    sp.hidden = !sp.hidden;
    if (!sp.hidden) { const i = sp.querySelector('input'); i.focus(); i.select(); }
  }

  function textsOf(l) {
    const out = [{ s: l.title || '', sec: '' }];
    let sec = '';
    (l.items || []).forEach(it => {
      if (it.t === 'h') sec = it.text || '';
      if (it.text) out.push({ s: it.text, sec });
      if (it.caption) out.push({ s: it.caption, sec });
      if (Array.isArray(it.items)) it.items.forEach(x => out.push({ s: String(x), sec }));
    });
    return out;
  }

  function searchPanel() {
    const input = h('input', { class: 'sin', type: 'search', placeholder: 'Поиск по этой теме', 'aria-label': 'Поиск по тексту', autocomplete: 'off' });
    const res = h('ul', { class: 'res' });
    const run = () => {
      res.replaceChildren();
      const raw = input.value.trim(), q = raw.toLowerCase();
      if (!q) return;
      const hits = [];
      const l = data.lessons.find(x => x.id === cur);
      if (l) {
        for (const { s, sec } of textsOf(l)) {
          const p = s.toLowerCase().indexOf(q);
          if (p === -1) continue;
          const st = Math.max(0, p - 35), en = Math.min(s.length, p + q.length + 45);
          hits.push(h('li', {}, h('button', { class: 'hit', type: 'button', onclick: () => goTo(l.id, raw) },
            h('span', { class: 'hw' }, sec || l.title || 'Без названия'),
            h('span', { class: 'hs2' }, (st > 0 ? '…' : '') + s.slice(st, p), h('mark', {}, s.slice(p, p + q.length)),
              s.slice(p + q.length, en) + (en < s.length ? '…' : '')))));
          if (hits.length >= 60) break;
        }
      }
      res.append(h('li', { class: 'cnt' }, hits.length ? 'Найдено мест: ' + (hits.length >= 60 ? '60+' : hits.length) : 'Ничего не найдено'), ...hits);
    };
    input.addEventListener('input', run);
    input.addEventListener('keydown', e => { if (e.key === 'Escape') toggleSearch(); });
    return h('div', { class: 'sp', id: 'sp', hidden: 'hidden' }, h('div', { class: 'spin' }, input, res));
  }

  function goTo(id, q) {
    hl = q;
    $('sp').hidden = true;
    if (id === cur) render();
    else { keepHl = true; location.hash = '#l-' + id; }
  }

  function applyHl() {
    if (!hl || editing) return;
    const root = document.querySelector('.content'); if (!root) return;
    const q = hl.toLowerCase();
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    let first = null;
    for (const n of nodes) {
      if (n.parentElement && n.parentElement.closest('.mtoc')) continue;
      const val = n.nodeValue, low = val.toLowerCase();
      let p = low.indexOf(q); if (p === -1) continue;
      const frag = document.createDocumentFragment(); let last = 0;
      while (p !== -1) {
        frag.append(val.slice(last, p));
        const m = h('mark', {}, val.slice(p, p + q.length)); frag.append(m); if (!first) first = m;
        last = p + q.length; p = low.indexOf(q, last);
      }
      frag.append(val.slice(last)); n.replaceWith(frag);
    }
    if (first) setTimeout(() => first.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
  }

  function homeEl() {
    return h('main', { class: 'home' },
      F('h1', 'hl', data, 'title', 'Название'),
      F('p', 'hs', data, 'subtitle', 'Подзаголовок', true),
      h('div', { class: 'cards' }, data.lessons.map((l, i) =>
        h('a', { class: 'card', href: '#l-' + l.id },
          h('span', { class: 'num' }, String(i + 1)),
          h('span', { class: 'ct' }, l.title || 'Без названия'),
          h('span', { class: 'cd' }, 'Открыть →')))));
  }

  function render() {
    document.title = data.title || 'Конспект';
    document.body.classList.toggle('editing', editing);
    const foot = h('footer', {}, F('span', '', data, 'footer', 'Подпись'),
      editing ? null : h('button', { class: 'linkbtn', type: 'button', onclick: login }, 'Редактор'));
    if (!cur) {
      $('root').replaceChildren(homeEl(), foot);
      renderUI();
      return;
    }
    const idx = data.lessons.findIndex(l => l.id === cur);
    $('root').replaceChildren(
      h('header', { class: 'top' },
        h('button', { class: 'menubtn', type: 'button', 'aria-label': 'Список тем', onclick: () => document.body.classList.toggle('menu') }, '☰'),
        h('a', { class: 'homebtn', href: '#home' }, '⌂ Главная'),
        F('div', 'brand', data, 'title', 'Название'),
        searchBtn()),
      searchPanel(),
      h('div', { class: 'layout' },
        h('aside', { class: 'side' },
          h('ul', { id: 'toc', class: 'toc' })),
        h('main', { class: 'content' }, idx >= 0 ? lessonEl(data.lessons[idx], idx) : h('p', {}, 'Тем пока нет.'))),
      foot);
    renderToc(); renderUI(); applyHl();
  }

  function renderUI() {
    const ui = $('ui'); ui.replaceChildren();
    if (!editing) return;
    const menu = h('div', { class: 'menu', hidden: 'hidden' },
      Object.values(ITEM_TYPES).map(t => h('button', { type: 'button', onclick: () => {
        const l = data.lessons.find(x => x.id === cur); if (!l) return;
        l.items.push(t.make()); save(); render(); menu.hidden = true;
        setTimeout(() => { const all = document.querySelectorAll('.item'); const last = all[all.length - 1]; if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
      } }, t.label)));
    ui.append(menu, h('div', { class: 'tools' },
      h('button', { type: 'button', onclick: () => {
        const l = { id: uid(), title: 'Новая тема', items: [{ t: 'text', text: 'Текст темы.' }] };
        data.lessons.push(l); save(); location.hash = '#l-' + l.id;
      } }, '+ Тема'),
      cur ? h('button', { type: 'button', onclick: () => { menu.hidden = !menu.hidden; } }, '+ Блок') : null,
      h('button', { class: 'pri', type: 'button', onclick: exportHtml }, 'Скачать файл'),
      h('button', { type: 'button', onclick: changePass }, 'Пароль'),
      h('button', { type: 'button', onclick: resetAll }, 'Сброс'),
      h('button', { type: 'button', onclick: logout }, 'Выйти')));
  }

  /* ---------- вход, пароль ---------- */
  async function hashPw(pw, saltHex) {
    const salt = Uint8Array.from(saltHex.match(/../g).map(x => parseInt(x, 16)));
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 100000 }, key, 256);
    return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function login() {
    if (!(window.crypto && crypto.subtle)) { alert('Вход работает только по HTTPS (на GitHub Pages он есть).'); return; }
    const input = h('input', { type: 'password', placeholder: 'Пароль', autocomplete: 'current-password' });
    const err = h('div', { class: 'err', role: 'alert' });
    const close = () => ov.remove();
    const go = async () => {
      err.textContent = '';
      await new Promise(r => setTimeout(r, Math.min(fails, 5) * 700));
      if ((await hashPw(input.value, data.auth.salt)) === data.auth.hash) {
        fails = 0; editing = true;
        try { sessionStorage.setItem('konspekt-edit', '1'); } catch {}
        close(); render();
      } else { fails++; err.textContent = 'Неверный пароль.'; input.select(); }
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    const ov = h('div', { class: 'ov', onclick: e => { if (e.target === ov) close(); } },
      h('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true' },
        h('h3', {}, 'Режим редактора'), input, err,
        h('div', { class: 'row' }, h('button', { type: 'button', onclick: close }, 'Отмена'),
          h('button', { class: 'go', type: 'button', onclick: go }, 'Войти'))));
    document.body.append(ov); input.focus();
  }

  function logout() {
    editing = false;
    try { sessionStorage.removeItem('konspekt-edit'); } catch {}
    render();
  }

  async function changePass() {
    if (!(window.crypto && crypto.subtle)) return;
    const a = prompt('Новый пароль (не короче 10 символов):');
    if (!a) return;
    if (a.length < 10) { alert('Пароль слишком короткий.'); return; }
    const salt = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
    data.auth = { salt, hash: await hashPw(a, salt) };
    save();
    alert('Пароль изменён. Скачайте файл и загрузите его на GitHub, иначе на сайте останется старый пароль.');
  }

  function resetAll() {
    if (!confirm('Сбросить все несохранённые правки и вернуть версию, опубликованную на сайте?')) return;
    try { localStorage.removeItem(KEY); sessionStorage.removeItem('konspekt-edit'); } catch {}
    location.reload();
  }

  function exportHtml() {
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector('#root').replaceChildren();
    clone.querySelector('#ui').replaceChildren();
    clone.querySelector('body').removeAttribute('class');
    clone.querySelector('title').textContent = data.title || 'Конспект';
    clone.querySelector('#site-data').textContent = '\n' + JSON.stringify(data, null, 1).replace(/</g, '\\u003c') + '\n';
    const html = '<!doctype html>\n' + clone.outerHTML;
    const a = h('a', { href: URL.createObjectURL(new Blob([html], { type: 'text/html' })), download: 'index.html' });
    document.body.append(a); a.click(); a.remove();
  }

  addEventListener('hashchange', () => {
    document.body.classList.remove('menu');
    if (!keepHl) hl = ''; keepHl = false;
    pickCur(); render(); if (!hl) window.scrollTo(0, 0);
  });
  document.addEventListener('click', e => { if (e.target === document.body) document.body.classList.remove('menu'); });

  if (location.hash === '#edit') { history.replaceState(null, '', location.pathname); if (!editing) setTimeout(login, 0); }
  pickCur(); render();
})();
</script>
